name: Gerar pacote Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:hostinger
      - uses: actions/upload-artifact@v4
        with:
          name: padaria-hostinger
          path: release/hostinger/
          if-no-files-found: error
          include-hidden-files: true
